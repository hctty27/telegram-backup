name: telegram-backup-v2
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: telegram_backup_v2
      POSTGRES_USER: telegram_backup
      POSTGRES_PASSWORD: ${V2_DB_PASSWORD:?set V2_DB_PASSWORD}
    volumes:
      - postgres_v2:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U telegram_backup -d telegram_backup_v2"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.v2
    command: ["migrate"]
    environment:
      V2_DATABASE_URL: postgres://telegram_backup:${V2_DB_PASSWORD}@postgres:5432/telegram_backup_v2?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  app:
    build:
      context: .
      dockerfile: Dockerfile.v2
    environment:
      V2_DATABASE_URL: postgres://telegram_backup:${V2_DB_PASSWORD}@postgres:5432/telegram_backup_v2?sslmode=disable
      V2_ADMIN_TOKEN: ${V2_ADMIN_TOKEN:?set V2_ADMIN_TOKEN}
      V2_ENCRYPTION_KEY: ${V2_ENCRYPTION_KEY:?set V2_ENCRYPTION_KEY}
      V2_ENABLE_WORKERS: ${V2_ENABLE_WORKERS:-true}
      V2_CACHE_GIB: ${V2_CACHE_GIB:-10}
      V2_MIN_FREE_GIB: ${V2_MIN_FREE_GIB:-5}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - app_v2:/var/lib/telegram-backup-v2
volumes:
  postgres_v2:
  app_v2:
