name: V2 foundation

on:
  push:
    branches: [v2-rewrite]
  pull_request:
    branches: [v2-rewrite]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Resolve pinned dependencies
        run: go mod tidy
      - name: Compile
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
