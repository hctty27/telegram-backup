name: telegram-backup
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: telegram_backup
      POSTGRES_USER: telegram_backup
      POSTGRES_PASSWORD: ${TGB_DB_PASSWORD:?set TGB_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U telegram_backup -d telegram_backup"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["migrate"]
    environment:
      TGB_DATABASE_URL: postgres://telegram_backup:${TGB_DB_PASSWORD}@postgres:5432/telegram_backup?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TGB_DATABASE_URL: postgres://telegram_backup:${TGB_DB_PASSWORD}@postgres:5432/telegram_backup?sslmode=disable
      TGB_ADMIN_TOKEN: ${TGB_ADMIN_TOKEN:?set TGB_ADMIN_TOKEN}
      TGB_ENCRYPTION_KEY: ${TGB_ENCRYPTION_KEY:?set TGB_ENCRYPTION_KEY}
      TGB_ENABLE_WORKERS: ${TGB_ENABLE_WORKERS:-true}
      TGB_CACHE_GIB: ${TGB_CACHE_GIB:-10}
      TGB_MIN_FREE_GIB: ${TGB_MIN_FREE_GIB:-5}
      TGB_GOOGLE_REDIRECT_URI: ${TGB_GOOGLE_REDIRECT_URI:-}
    ports:
      - "127.0.0.1:${TGB_PORT:-8080}:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "server", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - app_data:/var/lib/telegram-backup
volumes:
  postgres_data:
  app_data:
